<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>Work Timer</title>
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <main>
      <p id="loading">불러오는 중…</p>

      <section id="login" hidden>
        <div class="row mode" role="tablist" aria-label="로그인 또는 회원가입">
          <button type="button" role="tab" data-mode="login">로그인</button>
          <button type="button" role="tab" data-mode="signup">회원가입</button>
        </div>
        <p class="hint" id="login-hint"></p>
        <form id="login-form">
          <label for="username">아이디</label>
          <input id="username" type="text" required autocapitalize="none" spellcheck="false" maxlength="20" autocomplete="username" />
          <label for="password">비밀번호</label>
          <input id="password" type="password" required maxlength="128" />
          <label for="confirmation" class="signup-only">비밀번호 확인</label>
          <input id="confirmation" class="signup-only" type="password" maxlength="128" autocomplete="new-password" />
          <button id="login-submit"></button>
        </form>
      </section>

      <section id="view-timer" hidden>
        <section id="active" hidden>
          <p class="state" id="state"></p>
          <h1 id="title"></h1>
          <p class="clock" id="clock">0:00:00</p>
          <div class="row">
            <button id="toggle"></button>
            <button id="finish">종료</button>
          </div>
        </section>

        <form id="start" hidden>
          <label for="new-title">새 작업</label>
          <input id="new-title" maxlength="200" placeholder="업무 제목" required />
          <button>시작</button>
        </form>
      </section>

      <section id="view-summary" hidden>
        <h2>하루 요약</h2>
        <p class="total" id="sum-total">0:00:00</p>
        <p class="state" id="sum-count"></p>
        <svg class="day-clock" id="day-clock" viewBox="0 0 240 240" role="img" aria-label="하루 활동 시계"></svg>
      </section>

      <section id="view-log" hidden>
        <h2>업무 일지</h2>
        <ul class="list" id="log-list"></ul>
      </section>

      <section id="view-memo" hidden>
        <h2>메모장</h2>
        <ul class="list" id="memo-list"></ul>
      </section>

      <p id="error" role="alert"></p>
    </main>

    <nav aria-label="화면 이동" hidden>
      <button data-view="timer">타이머</button>
      <button data-view="summary">요약</button>
      <button data-view="log">일지</button>
      <button data-view="memo">메모</button>
      <button id="logout">로그아웃</button>
    </nav>
  </body>
</html>
